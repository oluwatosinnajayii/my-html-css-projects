<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="job.css">
</head>
<body>
    <div class="container">
        <h1>Job Application Form</h1>
        <form action="#">
            <label for="name" class="label">Full Name:</label>
            <input type="text" name="name" id="name" required placeholder="Enter your name" class="input">
            <label for="email" class="label">Email:</label>
            <input type="email" name="name" id="email" required placeholder="Enter your email" class="input">

            <label for="position" class="label">Position</label>
            <select name="position" id="position" required class="input">
                <option value="">Seclect an option</option>
                <option value="Product Manager">Product manager</option>
                <option value="sales manager">Sales Manager</option>
                <option value="Manager">Manager</option>
            </select>

            <fieldset>
                <legend>Availability</legend>
                <input type="radio" name="Availability" id="Full-time" value="Full-time" required class="option">
                <label for="Full-time">Full-time</label>
                <input type="radio" name="Availability" id="part-time" value="part-time" required class="option">
                <label for="part-time">Part-time</label>
            </fieldset>

            <label for="Message" class="label">Why do you want this Job?</label>
            <textarea name="message" id="message" cols="30" rows="8" class="input"></textarea>
        </form>

        <button class="Submit" type="submit">Submit Application</button>
    </div>
</body>
</html>
