<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent Teacher Conference</title>
    <link rel="stylesheet" href="PT.css">
</head>
<body>
    <div class="container">
        <h1>Parent Teacher Conference</h1>
        <p>Please fill out the form below to help schedule your paren-teacher conference</p>
        
            <form action="#">
               <fieldset>
                <legend>Student Informatiom</legend>
                <label for="name">Full Name:</label>
                <input type="text" name="Full Name" id="name" required placeholder="E.g. Joe Doe">
                <label for="Grade">Student Grade:</label>
                <input type="number" name="Grade" id="Grade" required placeholder="E.g., 4">
               </fieldset>

               <fieldset>
                <legend>Parent/Guardian Name</legend>
                <label for="Parentguardian">Parent/Guardian Name:</label>
                <input type="text" id="Parentguardian" name="Parentguardian" required placeholder="E.g., Nancy Doe" required >
               </fieldset>

               <fieldset>
                <legend>Preferred Contact method</legend>
                <label for="email">Email:</label>
                <input type="radio" id="email" name="contact-method"  value="email" checked class="contact-method-radio-btn">
                <label for="phone">Phone:</label>
                <input type="radio" id="phone" name="contact-method" value="phone" class="contact-method-radio-btn">  
               </fieldset>

               <fieldset>
                <legend>Additional Notes</legend>
                <label for="Additional-notes">Any Specific concerns or topics you'd like to discuss?</label>
                <textarea name="Additional-notes" id="Additional-notes" cols="30" rows="10"></textarea>
            </fieldset>

            <button type="submit" class="submit-btn">Submit Form</button>
            </form>
       
    </div>
</body>
</html>
