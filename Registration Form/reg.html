<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="reg.css">
</head>
<body>
    <h1>Registration Form</h1>
    <p>Please fill out this form with the required information</p>
    <form action="#" method="post">
        <fieldset>
            <label for="first-name">Enter Your First Name: <input type="text" id="first-name" name="first-name" required></label>
            <label for="last-name"> Enter Your Last Name:  <input type="text" id="last-name" name="last-name" required></label>
            <label for="email"> Enter Your Email:  <input type="email" id="email" name="email" required></label>
            <label for="password"> Create a New Password:  <input type="password" id="password" name="password" required pattern="[a-z0-9{8,}]"></label>
        </fieldset>

        <fieldset>
            <legend>Account type(required)</legend>
            <label for="personal"> <input type="radio" id="personal" name="account-type" checked class="inline"> Personal</label>
            <label for="business">  <input type="radio" id="business" name="account-type" class="inline"> Business</label>
        </fieldset>

        <fieldset>
            <label for="profile-picture"> Upload a profile picture: <input type="file" id="profile-picture" name="profile-picture"></label>
            <label for="age"> Input your age (years): <input type="number" id="age" minlength="13" max="130"></label>

             <label for="visibility"> How did you hear about us?  
                <select name="visibility" id="visibility" class="select">
                    <option value="">(select one)</option>
                    <option value="freeCodeCamp-News">freeCodeCamp News</option>
                    <option value="freeCodeCamp-Youtube-Channel">freeCodeCamp Youtube Channel</option>
                    <option value="freeCodeCamp-forum">freeCodeCamp Forum</option>
                    <option value="other">Other</option>
                </select>
            </label>
            <label for="bio">Provide a bio: <textarea name="bio" id="bio" cols="30" rows="3" placeholder="i like coding on the beach"></textarea></label>
        </fieldset>

        <a href="#">Read our terms and conditions</a>
        <label for="terms-and-conditions">
            <input type="checkbox" id="terms-and-conditions" name="terms-and-conditions" required  class="inline">
            I accept the terms and conditions
        </label>

        <input type="submit" name="submit" id="submit" value="Submit">
    </form>
</body>
</html>
